<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beacon · Sign in</title><style>body{margin:0;font:16px system-ui;background:#0f192d;color:#d4e2fa;min-height:100vh;display:grid;place-items:center}main{width:min(390px,85vw)}h1{font-size:38px;letter-spacing:-2px}p{color:#8ea4c8;line-height:1.8}input,button{box-sizing:border-box;width:100%;padding:14px;margin-top:15px;font:inherit;border-radius:7px;border:1px solid #38517b}button{background:#305bfa;color:white;cursor:pointer}small{display:block;color:#94a9cc;margin-top:20px}#error{color:#ffbeaa}</style></head><body><main><h1>beacon.</h1><p>Sign in to your portable evidence workspace with your assigned access token.</p><form id="form"><label for="token">Access token</label><input id="token" type="password" autocomplete="off" required><button>Open workspace</button></form><p id="error" role="alert"></p><small>Tokens are exchanged for a one-hour HttpOnly session. Production enterprise SSO requires an identity integration.</small></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();try{const r=await fetch('/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.getElementById('token').value})});if(!r.ok)throw Error('Sign-in failed. Check your access token.');location.assign('/')}catch(e){document.getElementById('error').textContent=e.message}})</script></body></html>
