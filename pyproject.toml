[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon"
version = "0.1.0"
description = "Beacon GRC evidence engine — signed witness chain, SCF hub, cloud inspectors."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kyle Cain" }]
keywords = ["grc", "evidence", "scf", "compliance", "witness"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "cryptography>=41",
  "click>=8.1",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "textual>=0.70",
  "pydantic>=2",
  "boto3>=1.34.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "moto>=5.0.5,<6",
]

[project.scripts]
beacon = "beacon.cli:main"

[tool.setuptools.packages.find]
include = ["beacon*"]

[tool.setuptools.package-data]
beacon = [
  "fixtures/*.json",
  "scf/offline/*.json",
  "gui/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
