name: Beacon checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beacon-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      BEACON_SCF_OFFLINE: '1'
      BEACON_FORCE_FIXTURE: '1'
      BEACON_REQUIRE_POLICY_TESTS: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.17'
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen --all-extras --python '${{ matrix.python }}'
      - name: Install checksum-pinned Conftest
        run: |
          curl --fail --location --silent --show-error --retry 3 -o conftest_0.56.0_Linux_x86_64.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz
          sha256sum --check scripts/conftest.sha256
          mkdir -p "$RUNNER_TEMP/beacon-bin"
          tar -xzf conftest_0.56.0_Linux_x86_64.tar.gz -C "$RUNNER_TEMP/beacon-bin" conftest
          echo "$RUNNER_TEMP/beacon-bin" >> "$GITHUB_PATH"
      - name: Validate dependencies and syntax
        run: |
          uv pip check
          uv run --frozen python -m compileall -q beacon
          node --check beacon/gui/static/app.js
      - name: Run Python and Terraform policy regressions
        run: uv run --frozen pytest -ra
  required:
    name: Required checks
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the complete matrix
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
